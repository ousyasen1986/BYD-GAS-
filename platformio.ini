[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.psram = enabled
lib_deps = 
    lvgl/lvgl @ ~8.3.11
    bblanchon/ArduinoJson @ ^6.21.3
build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -I lib
    -DBOARD_HAS_PSRAM
